name: Solidity tests
on:
  push:
    paths-ignore:
      - '**.md'
permissions:
  contents: read
jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - run: node --version
      - name: Resolve reviewed toolchain lock in disposable CI
        run: |
          npm install --global npm@11.8.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Record generated dependency lock for source review
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=readFileSync('package-lock.json');
          console.log('REVIEW_LOCK_SHA256='+createHash('sha256').update(bytes).digest('hex'));
          const encoded=bytes.toString('base64');
          for(let i=0;i<encoded.length;i+=6000)console.log('REVIEW_LOCK_CHUNK='+encoded.slice(i,i+6000));
          console.log('REVIEW_LOCK_END');
          NODE
      - run: npm ci
      - run: npm run test:ci
